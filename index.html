<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>t81</title>
<meta name="theme-color" content="#0F1218">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preload" href="/fonts/space-grotesk-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: "Space Grotesk";
    src: url("/fonts/space-grotesk-700.woff2") format("woff2");
    font-weight: 700;
    font-display: swap;
  }
  :root {
    --ink: #0F1218;
    --paper: #F2F1EC;
    --signal: #3B82F6;
    --grid: #1A1F28;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background-color: var(--ink);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 60px 60px;
    background-position: center center;
    display: grid;
    place-items: center;
    font-family: "Space Grotesk", system-ui, sans-serif;
  }
  .mark {
    width: clamp(160px, 28vmin, 240px);
    aspect-ratio: 1;
    border-radius: 22%;
    background: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.03em;
    font-size: clamp(70px, 12.3vmin, 106px);
    animation: rise 900ms cubic-bezier(.2,.7,.2,1) both;
  }
  .word {
    color: var(--ink);
    font-weight: 700;
    letter-spacing: -0.057em;
    line-height: 1;
  }
  .cursor {
    width: 0.18em;
    height: 0.11em;
    background: var(--signal);
    align-self: flex-end;
    margin-bottom: calc(50% - 0.34em);
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  @media (prefers-reduced-motion: reduce) {
    .mark, .cursor { animation: none; }
  }
</style>
</head>
<body>
  <main class="mark" role="img" aria-label="t81">
    <span class="word" aria-hidden="true">t81</span>
    <span class="cursor" aria-hidden="true"></span>
  </main>
</body>
</html>
